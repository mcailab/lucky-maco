<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lucky Maco</title>
<link rel="icon" href="brand/maco-face.png">
<style>
  :root{
    color-scheme:light dark;
    --bg:#F4F6FA; --dim:#8A93A3; --line:rgba(27,42,91,.14);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0E1430; --dim:rgba(255,255,255,.38); --line:rgba(255,255,255,.12) }
  }
  *{box-sizing:border-box}
  /* Shaking the phone can trigger Safari's pull-to-refresh and reload the game
     mid-spin. Lock the overscroll. */
  html,body{height:100%;overscroll-behavior:none;touch-action:manipulation}
  body{margin:0;background:var(--bg);
    font:500 15px/1.5 ui-rounded,-apple-system,"Segoe UI",system-ui,sans-serif}
  /* The machine is the page — it renders centred, fixed. This is just the floor. */
  footer{position:fixed;left:0;right:0;bottom:18px;text-align:center;
    font-size:12px;color:var(--dim);letter-spacing:.02em}
  footer a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line);
    padding-bottom:1px;transition:color .15s}
  footer a:hover{color:#E9982B;border-color:#E9982B}
  footer span{opacity:.45;margin:0 8px}
</style>
</head>
<body>
  <footer>
    <a href="about.html">What is this?</a><span>&middot;</span><a href="about.html#embed">Put it on your page</a>
  </footer>
  <script src="luckymaco.js" data-mode="page" defer></script>
</body>
</html>
