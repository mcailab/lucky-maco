<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lucky Maco</title>
<link rel="icon" href="brand/maco-face.png">
<style>
  :root{
    color-scheme:light dark;
    --bg:#F4F6FA; --line:rgba(27,42,91,.14);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0E1430; --line:rgba(255,255,255,.12) }
  }
  *{box-sizing:border-box}
  /* Shaking the phone can trigger Safari's pull-to-refresh and reload the game
     mid-spin. Lock the overscroll. */
  html,body{height:100%;overscroll-behavior:none;touch-action:manipulation}
  body{margin:0;background:var(--bg);
    font:500 15px/1.5 ui-rounded,-apple-system,"Segoe UI",system-ui,sans-serif}
  /* The machine is the page — it renders centred, fixed. This is just the floor. */
</style>
</head>
<body>
  <script src="luckymaco.js" data-mode="page" defer></script>
</body>
</html>
