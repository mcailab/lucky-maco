<style>
  :root{
    color-scheme:light dark;
    --bg:#F4F6FA; --txt:#2D3436; --mut:#6B7280; --line:rgba(27,42,91,.12);
    --gold:#B87410; --lit:#E9982B; --slot:rgba(27,42,91,.055); --sheen:rgba(255,255,255,.85);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0E1430; --txt:#F2F4F9; --mut:rgba(255,255,255,.58); --line:rgba(255,255,255,.11);
           --gold:#FFD772; --lit:#FFC96B; --slot:rgba(255,255,255,.055); --sheen:rgba(255,255,255,.14) }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);display:grid;place-items:center;
    padding:32px 20px;text-align:center;
    font:500 16px/1.6 ui-rounded,-apple-system,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  .maco{width:112px;height:112px;display:block;margin:0 auto 22px;
    filter:drop-shadow(0 12px 26px rgba(233,152,43,.42));
    animation:bob 3.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(-4deg)}}
  h1{margin:0;font-size:33px;letter-spacing:-.015em;color:var(--gold)}
  p{margin:10px auto 0;max-width:340px;color:var(--mut);font-size:15px}
  .reels{display:flex;gap:9px;justify-content:center;margin:32px 0 26px}
  .slot{width:60px;height:60px;border-radius:13px;background:var(--slot);
    border:1px solid var(--line);position:relative;overflow:hidden}
  .slot::after{content:"";position:absolute;inset:0;
    background:linear-gradient(105deg,transparent 35%,var(--sheen) 50%,transparent 65%);
    transform:translateX(-120%);animation:sheen 2.6s ease-in-out infinite}
  .slot:nth-child(2)::after{animation-delay:.22s}
  .slot:nth-child(3)::after{animation-delay:.44s}
  @keyframes sheen{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
  .pill{display:inline-block;padding:7px 17px;border-radius:999px;font-size:12px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;color:var(--lit);
    border:1px solid var(--line);background:linear-gradient(180deg,rgba(233,152,43,.14),transparent)}
  footer{position:fixed;left:0;right:0;bottom:22px;display:flex;align-items:center;
    justify-content:center;gap:8px;font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--mut);opacity:.72}
  footer img{width:17px;height:17px}
  @media (prefers-reduced-motion:reduce){.maco,.slot::after{animation:none}}
</style>
</head>
