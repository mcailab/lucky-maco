<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucky Maco — pour styles</title>
<link rel="icon" href="brand/maco-face.png">
<style>
  :root{color-scheme:light dark;
    --bg:#F4F6FA;--card:#fff;--txt:#2D3436;--mut:#6B7280;--line:rgba(27,42,91,.14);
    --jar:rgba(27,42,91,.05);--br:rgba(233,152,43,.45);--gold:#B87410;--lit:#E9982B;--chip:rgba(27,42,91,.06)}
  @media (prefers-color-scheme:dark){:root{
    --bg:#0E1430;--card:linear-gradient(180deg,#22305F,#121A38);--txt:#fff;--mut:rgba(255,255,255,.62);
    --line:rgba(255,255,255,.10);--jar:rgba(255,255,255,.05);--br:rgba(255,201,107,.35);
    --gold:#FFD772;--lit:#FFC96B;--chip:rgba(255,255,255,.07)}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);
    display:grid;place-items:start center;padding:26px 16px 70px;
    font:500 15px/1.55 ui-rounded,-apple-system,"Segoe UI",system-ui,sans-serif}
  .wrap{width:min(420px,96vw)}
  h1{font-size:20px;margin:0 0 4px;text-align:center}
  .lede{text-align:center;color:var(--mut);font-size:13px;margin:0 0 18px}
  .tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:14px}
  .tabs button{padding:10px 8px;border:1px solid var(--line);border-radius:12px;background:var(--chip);
    color:var(--txt);font:600 13px/1.2 inherit;cursor:pointer;transition:.15s}
  .tabs button.on{background:var(--lit);color:#fff;border-color:transparent}
  .cab{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:16px;
    box-shadow:0 24px 60px rgba(27,42,91,.20)}
  canvas{display:block;width:100%;border-radius:16px;background:var(--jar);
    border:2px solid var(--br);touch-action:none}
  .msg{min-height:48px;display:grid;place-items:center;text-align:center;margin-top:10px}
  .msg b{font-size:18px}.msg.win b{color:var(--gold)}.msg.jackpot b{font-size:23px;color:var(--gold)}
  .msg small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
  .go{display:block;width:100%;padding:13px;border:0;border-radius:13px;background:var(--lit);
    color:#fff;font:700 15px/1 inherit;cursor:pointer;letter-spacing:.02em}
  .go:disabled{opacity:.45;cursor:default}
  .about{margin-top:16px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--chip)}
  .about h2{margin:0 0 6px;font-size:14px;color:var(--gold)}
  .about p{margin:0 0 8px;font-size:13px;color:var(--mut)}
  .about .v{font-size:12.5px}
  .about .v b{color:var(--txt)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Pour styles</h1>
  <p class="lede">Four ways to stage the same draw. Play each, pick one.</p>

  <div class="tabs" id="tabs"></div>

  <div class="cab">
    <canvas id="c" width="680" height="780"></canvas>
    <div class="msg" id="msg"><b>Pick a style</b><small>then press play</small></div>
    <button class="go" id="go">PLAY</button>
  </div>

  <div class="about" id="about"></div>
</div>

<script>
const MACOJI=['blush','cry','dizzy','eyes','fire','grimace','grin','heart-eyes','hearts','innocent',
 'joy','neutral','open-mouth','pleading','rage','relieved','scream','sleeping','smirk','sob',
 'sparkles','star-struck','sunglasses','sweat-smile','thinking','tongue','wink','yum'];
const label=n=>String(n).split('-').map(s=>s[0].toUpperCase()+s.slice(1)).join(' ');

/* outcome-first — identical to the shipped widget. Physics never decides. */
const ODDS={triple:.05,pair:.20,nearMiss:.60};
const pickN=n=>{const p=MACOJI.slice(),o=[];for(let i=0;i<n;i++)o.push(...p.splice(Math.random()*p.length|0,1));return o};
function drawResult(){
  const r=Math.random();
  if(r<ODDS.triple){const a=pickN(1)[0];return{pattern:'TRIPLE',reels:[a,a,a]}}
  if(r<ODDS.triple+ODDS.pair){const d=pickN(2),q=Math.random();
    const at=q<ODDS.nearMiss?2:(q<ODDS.nearMiss+(1-ODDS.nearMiss)/2?1:0);
    const x=[d[0],d[0],d[0]];x[at]=d[1];return{pattern:'PAIR',reels:x}}
  return{pattern:'ALLDIFF',reels:pickN(3)};
}

const IMG={};let loaded=0;
MACOJI.forEach(n=>{const i=new Image();i.src='macoji/macoji-'+n+'.png';
  i.onload=()=>{if(++loaded===MACOJI.length)go.disabled=false};IMG[n]=i});

/* ── shared circle solver. Per-body radius so pegs work too. ───────────── */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height,R=44;
const G=.85,REST=.34,DAMP=.992,WALL=.5;
let bodies=[],pegs=[],phase='idle',t=0,result=null,style='drain',floorGap=false,lanes=false;

function add(name,x,y,vx,vy,extra){
  return bodies.push(Object.assign({name,x,y,vx,vy,r:R,a:Math.random()*6.28,
    va:(Math.random()-.5)*.2,fixed:false,win:false},extra||{}))-1;
}
function step(){
  for(const b of bodies){
    if(b.fixed)continue;
    if(b.guide!==undefined){                       // plinko: invisible steering
      const k=Math.min(1,Math.max(0,(b.y-140)/(H-300)));
      b.vx+=(b.guide-b.x)*0.0016*k;
    }
    b.vy+=G;b.vx*=DAMP;b.vy*=DAMP;b.x+=b.vx;b.y+=b.vy;b.a+=b.va;b.va*=.97;
    if(lanes){                                     // cascade: walls between columns
      const lw=W/3,li=Math.min(2,Math.max(0,Math.floor(b.x/lw)));
      const lo=li*lw+b.r,hi=(li+1)*lw-b.r;
      if(b.x<lo){b.x=lo;b.vx=-b.vx*WALL}
      if(b.x>hi){b.x=hi;b.vx=-b.vx*WALL}
    }else{
      if(b.x<b.r){b.x=b.r;b.vx=-b.vx*WALL;b.va+=b.vy*.004}
      if(b.x>W-b.r){b.x=W-b.r;b.vx=-b.vx*WALL;b.va-=b.vy*.004}
    }
    const open=floorGap&&b.x>70&&b.x<W-70;
    if(!open&&b.y>H-b.r){b.y=H-b.r;b.vy=-b.vy*REST;b.vx*=.86;b.va*=.8}
  }
  const all=bodies.concat(pegs);
  for(let k=0;k<5;k++)
    for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){
      const a=all[i],b=all[j];
      if(a.fixed&&b.fixed)continue;
      let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;const min=a.r+b.r;
      if(d2>min*min||d2===0)continue;
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
      const mv=a.fixed||b.fixed?(min-d):(min-d)/2;
      if(!a.fixed){a.x-=nx*mv;a.y-=ny*mv}
      if(!b.fixed){b.x+=nx*mv;b.y+=ny*mv}
      const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
      if(rv>0)continue;
      const imp=-(1+REST)*rv/(a.fixed||b.fixed?1:2);
      if(!a.fixed){a.vx-=imp*nx;a.vy-=imp*ny;a.va-=imp*.004}
      if(!b.fixed){b.vx+=imp*nx;b.vy+=imp*ny;b.va+=imp*.004}
    }
  bodies=bodies.filter(b=>b.y<H+b.r*3);
}
function render(){
  ctx.clearRect(0,0,W,H);
  if(style==='plinko'){
    ctx.fillStyle='rgba(233,152,43,.45)';
    for(const p of pegs){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.29);ctx.fill()}
    ctx.strokeStyle='rgba(233,152,43,.28)';ctx.lineWidth=3;
    for(let i=1;i<3;i++){ctx.beginPath();ctx.moveTo(i*W/3,H-150);ctx.lineTo(i*W/3,H);ctx.stroke()}
  }
  if(lanes){ctx.strokeStyle='rgba(233,152,43,.22)';ctx.lineWidth=3;
    for(let i=1;i<3;i++){ctx.beginPath();ctx.moveTo(i*W/3,0);ctx.lineTo(i*W/3,H);ctx.stroke()}}
  if(style==='pick'){ctx.strokeStyle='rgba(233,152,43,.45)';ctx.lineWidth=3;
    ctx.strokeRect(40,26,W-80,132)}
  for(const b of bodies){
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.a);
    if(b.win){ctx.shadowColor='rgba(233,152,43,.95)';ctx.shadowBlur=28}
    ctx.drawImage(IMG[b.name],-b.r,-b.r,b.r*2,b.r*2);ctx.restore();
  }
}

/* ── the four stagings ─────────────────────────────────────────────────── */
const STYLES={
  drain:{
    name:'Fill &amp; Drain', tab:'Fill &amp; Drain',
    blurb:'The window floods with Macoji pouring in from the top. They pile, settle, then a trapdoor opens and everything drains away except your three, left sitting on the payline.',
    verdict:'<b>Best all-rounder.</b> Reads as a pour, resolves in ~4s, and ends in the same 3-across payline the reels version already uses — so all the win logic and messaging carry over untouched.',
    start(){pegs=[];lanes=false;floorGap=false;},
    frame(){
      if(phase==='pour'){
        if(t%3===0&&bodies.length<40)add(MACOJI[Math.random()*28|0],W/2+(Math.random()-.5)*160,-R,(Math.random()-.5)*7,3+Math.random()*4);
        if(bodies.length>=40&&t>140){phase='settle';t=0}
      } else if(phase==='settle'){ if(t>50){phase='drain';floorGap=true;t=0;pin();} }
      else if(phase==='drain'){ if(t>85){floorGap=false;finish()} }
    }},
  pick:{
    name:'Bucket Pour &amp; Pick', tab:'Pour &amp; Pick',
    blurb:'A bucket tips at the top and the whole set tumbles out into a heap, Tsum Tsum style. Your three were poured last so they land on top — then they rise out of the pile into the tray.',
    verdict:'<b>Most charming, most literal to your bucket idea.</b> Shows off the whole set piled up. Slowest of the four (~6s) and the pile stays on screen, so it needs the most vertical room.',
    start(){pegs=[];lanes=false;floorGap=false;},
    frame(){
      if(phase==='pour'){
        if(t%3===0&&bodies.length<36)add(MACOJI[Math.random()*28|0],W*.34+(Math.random()-.5)*90,-R,1.5+Math.random()*3,2+Math.random()*3);
        if(bodies.length>=36&&t>130){                 // winners poured last -> land on top
          result.reels.forEach((n,i)=>add(n,W*.34+i*40,-R-i*90,2+Math.random()*2,3,{win:true,lift:true}));
          phase='settle';t=0;
        }
      } else if(phase==='settle'){ if(t>90){phase='lift';t=0} }
      else if(phase==='lift'){
        const xs=[W*.25,W*.5,W*.75];let k=0;
        for(const b of bodies) if(b.lift){
          const tx=xs[k],ty=92;k++;
          b.fixed=true;b.x+=(tx-b.x)*.11;b.y+=(ty-b.y)*.11;b.a*=.85;
        }
        if(t>60)finish();
      }
    }},
  plinko:{
    name:'Plinko Drop', tab:'Plinko',
    blurb:'A peg board. Three Macoji drop from the top and clatter down through the pegs into three bins. Each one is invisibly steered to the bin it was always going to land in.',
    verdict:'<b>Most suspenseful per-symbol</b> — you watch each result arrive separately. This is exactly how commercial Plinko works: RNG first, then the drop is rendered to match. Slowest to reveal all three.',
    start(){
      lanes=false;floorGap=false;pegs=[];
      for(let row=0;row<6;row++)for(let i=0;i<=row+3;i++){
        const y=200+row*88, sp=W/(row+4);
        pegs.push({x:sp*(i+.5),y,r:13,fixed:true,vx:0,vy:0,a:0,va:0,name:null});
      }
    },
    frame(){
      if(phase==='pour'){
        const xs=[W/6,W/2,W*5/6];
        if(t%46===0&&bodies.length<3){
          const i=bodies.length;
          add(result.reels[i],W/2+(Math.random()-.5)*70,-R,(Math.random()-.5)*3,2,{guide:xs[i],win:true});
        }
        if(bodies.length===3&&t>210){phase='settle';t=0}
      } else if(phase==='settle'){ if(t>70)finish(); }
    }},
  cascade:{
    name:'Three Cascades', tab:'Cascade',
    blurb:'Three vertical chutes. Macoji rain down each column and stack up from the bottom; the flow thins, slows, and the last one to land in each chute is your result.',
    verdict:'<b>Closest to the reels machine</b> but with real weight and bounce. Fastest of the four (~3s) and the tidiest layout — three columns, three answers, no ambiguity about what won.',
    start(){pegs=[];lanes=true;floorGap=false;},
    frame(){
      if(phase==='pour'){
        if(t%4===0&&bodies.length<24){
          const c=bodies.length%3;
          add(MACOJI[Math.random()*28|0],W/6+c*W/3+(Math.random()-.5)*30,-R,0,4+Math.random()*3);
        }
        if(bodies.length>=24&&t>120){
          result.reels.forEach((n,i)=>add(n,W/6+i*W/3,-R-140,0,3,{win:true}));
          phase='settle';t=0;
        }
      } else if(phase==='settle'){ if(t>110)finish(); }
    }}
};

function pin(){
  const xs=[W*.22,W*.5,W*.78];
  result.reels.forEach((n,i)=>add(n,xs[i],H-118,0,0,{fixed:true,win:true,a:0,va:0}));
}
function finish(){
  phase='done';
  const m=document.getElementById('msg'),r=result.reels;
  if(result.pattern==='TRIPLE'){m.className='msg jackpot';
    m.innerHTML='<b>&#127920; JACKPOT!</b><small>Triple '+label(r[0])+'</small>'}
  else if(result.pattern==='PAIR'){const d=r[0]===r[1]?r[0]:r[2];m.className='msg win';
    m.innerHTML='<b>&#10024; Nice pair!</b><small>Double '+label(d)+'</small>'}
  else{m.className='msg';
    m.innerHTML='<b>'+label(r[0])+' &rarr; '+label(r[1])+' &rarr; '+label(r[2])+'</b>'+
      '<small>morning to evening, that&rsquo;s your day</small>'}
  go.disabled=false;go.textContent='PLAY AGAIN';
}
function loop(){t++;if(phase!=='idle'&&phase!=='done')STYLES[style].frame();step();render();requestAnimationFrame(loop)}

/* ── ui ───────────────────────────────────────────────────────────────── */
const go=document.getElementById('go'),tabs=document.getElementById('tabs'),about=document.getElementById('about');
go.disabled=true;
Object.keys(STYLES).forEach(k=>{
  const b=document.createElement('button');b.innerHTML=STYLES[k].tab;b.dataset.k=k;
  b.onclick=()=>select(k);tabs.appendChild(b);
});
function select(k){
  style=k;bodies=[];phase='idle';t=0;
  [...tabs.children].forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  const S=STYLES[k];S.start();
  about.innerHTML='<h2>'+S.name+'</h2><p>'+S.blurb+'</p><p class="v">'+S.verdict+'</p>';
  const m=document.getElementById('msg');m.className='msg';
  m.innerHTML='<b>'+S.name+'</b><small>press play</small>';
  go.textContent='PLAY';
}
go.onclick=()=>{
  go.disabled=true;bodies=[];t=0;result=drawResult();
  const m=document.getElementById('msg');m.className='msg';m.innerHTML='<b>&nbsp;</b><small>&nbsp;</small>';
  STYLES[style].start();phase='pour';
};
select('drain');loop();
</script>
</body>
</html>
